name: "Release Builders"

on:
  workflow_dispatch: 

jobs:
  release:
    # 1. Grant the workflow permission to create a Release page
    permissions:
      contents: write 

    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      
      - name: Install Frontend Dependencies
        run: npm install
      
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          buildRunnerCommand: "npx tauri"
          # 2. Use tagName to force the creation of a new release
          tagName: v1.0.0
          releaseName: 'Tonnetz Pro v1.0.0'
          releaseBody: 'Automated build from GitHub Actions.'
          releaseDraft: true
          prerelease: false