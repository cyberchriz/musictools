name: "Release Builders"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g., v1.0.1)'
        required: true
        default: 'v1.0.1'

jobs:
  # ==========================================
  # JOB 1: DESKTOP BUILDERS (Mac, Win, Linux)
  # ==========================================
  desktop-release:
    permissions:
      contents: write 
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      
      - name: Install Frontend Dependencies
        run: npm install
      
      - name: Build Desktop Apps
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          buildRunnerCommand: "npx tauri"
          tagName: ${{ github.event.inputs.version }}
          releaseName: 'Tonnetz Pro ${{ github.event.inputs.version }}'
          releaseBody: 'Automated build from GitHub Actions.'
          releaseDraft: true
          prerelease: false

  # ==========================================
  # JOB 2: ANDROID BUILDER
  # ==========================================
  android-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Java (Required for Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Rust and Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}  # This tells Tauri to use the NDK pre-installed on GitHub's cloud server!
        run: npx tauri android build --apk
        
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tonnetz-Pro-Android-APK
          path: src-tauri/gen/android/**/*.apk